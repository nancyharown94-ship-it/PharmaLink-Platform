    <script src="assets/js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('userToken');
            if (!token) return window.location.href = 'auth.html';

            const parseJwt = (token) => {
                try { return JSON.parse(atob(token.split('.')[1])); } catch (e) { return null; }
            };
            const decoded = parseJwt(token);
            const pharmacyId = decoded ? decoded.id : null;
            if (!pharmacyId) return;

            const fetchInventory = async () => {
                try {
                    const res = await fetch(`http://localhost:3000/api/medicines/pharmacy/${pharmacyId}`);
                    if (res.ok) {
                        const medicines = await res.json();
                        renderInventory(medicines);
                    }
                } catch (error) {
                    console.error('Error fetching inventory:', error);
                }
            };

            const renderInventory = (medicines) => {
                const tbody = document.getElementById('inventory-tbody');
                tbody.innerHTML = '';
                if (medicines.length === 0) {
                    const emptyText = currentLang === 'ar' ? 'لا يوجد أدوية في المخزون' : 'No medicines in inventory';
                    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;" class="lang-text" data-ar="لا يوجد أدوية في المخزون" data-en="No medicines in inventory">${emptyText}</td></tr>`;
                    return;
                }
                medicines.forEach(med => {
                    const tr = document.createElement('tr');
                    
                    let statusClass = 'status-completed';
                    let statusTextAr = 'متوفر';
                    let statusTextEn = 'In Stock';
                    
                    if (med.stock === 0) {
                        statusClass = 'status-danger';
                        statusTextAr = 'غير متوفر';
                        statusTextEn = 'Out of Stock';
                    } else if (med.stock < 10) {
                        statusClass = 'status-warning';
                        statusTextAr = 'على وشك النفاذ';
                        statusTextEn = 'Low Stock';
                    }

                    const sym = currentLang === 'ar' ? 'جنيه' : 'EGP';
                    const statusText = currentLang === 'ar' ? statusTextAr : statusTextEn;

                    tr.innerHTML = `
                        <td><img src="${(med.images && med.images.length > 0) ? med.images[0] : 'https://cdn-icons-png.flaticon.com/512/2966/2966327.png'}" style="width:40px; height:40px; border-radius:8px; object-fit:cover;"></td>
                        <td>${med.name}</td>
                        <td>${med.therapeuticCategory || '-'}</td>
                        <td>${med.price} <span class="currency-symbol lang-text" data-ar="جنيه" data-en="EGP">${sym}</span></td>
                        <td>
                            <div class="stock-update">
                                <button class="qty-btn" onclick="updateStock('${med._id}', ${med.stock - 1})">-</button>
                                <input type="number" value="${med.stock}" class="qty-input" onchange="updateStock('${med._id}', this.value)">
                                <button class="qty-btn" onclick="updateStock('${med._id}', ${med.stock + 1})">+</button>
                            </div>
                        </td>
                        <td><span class="status-badge ${statusClass} lang-text" data-ar="${statusTextAr}" data-en="${statusTextEn}">${statusText}</span></td>
                        <td>
                            <div class="action-buttons">
                                <button class="btn-action btn-reject" onclick="deleteMedicine('${med._id}')" title="Delete"><i class="ph ph-trash"></i></button>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            };

            window.updateStock = async (id, newStock) => {
                if(newStock < 0) return;
                try {
                    const res = await fetch(`http://localhost:3000/api/medicines/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ stock: Number(newStock) })
                    });
                    if (res.ok) fetchInventory();
                } catch (error) {
                    console.error('Error updating stock', error);
                }
            };

            window.deleteMedicine = async (id) => {
                const confirmMsg = currentLang === 'ar' ? 'هل أنت متأكد من حذف هذا الدواء؟' : 'Are you sure you want to delete this medicine?';
                if(!confirm(confirmMsg)) return;
                try {
                    const res = await fetch(`http://localhost:3000/api/medicines/${id}`, { method: 'DELETE' });
                    if (res.ok) fetchInventory();
                } catch (error) {
                    console.error('Error deleting medicine', error);
                }
            };

            fetchInventory();
        });
    </script>
