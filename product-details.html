<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaLink - Medicine Details</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .details-container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--bg-card);
            border-radius: 24px;
            padding: 40px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
        }
        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 48px;
            align-items: start;
        }
        @media (max-width: 768px) {
            .details-grid {
                grid-template-columns: 1fr;
                gap: 32px;
            }
            .details-container {
                padding: 24px;
            }
        }
        .img-container {
            background: var(--bg-color);
            border-radius: 20px;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .img-container:hover {
            transform: scale(1.02);
            box-shadow: var(--shadow-md);
        }
        .detail-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 12px;
            transition: all 0.3s ease;
        }
        .info-pane {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .med-title {
            font-size: 32px;
            font-weight: 800;
            color: var(--text-main);
            margin: 0;
            line-height: 1.3;
        }
        .med-pharmacy {
            font-size: 16px;
            color: var(--primary-color);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .med-pharmacy i {
            font-size: 20px;
        }
        .price-badge {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary-color);
            display: flex;
            align-items: baseline;
            gap: 6px;
        }
        .meta-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin: 20px 0;
            padding: 20px 0;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }
        .meta-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .meta-label {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
        }
        .meta-val {
            font-size: 15px;
            color: var(--text-main);
            font-weight: 700;
        }
        .desc-text {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.7;
        }
        .action-bar {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 24px;
            flex-wrap: wrap;
        }
        .qty-selector {
            display: flex;
            align-items: center;
            gap: 16px;
            background: var(--bg-color);
            border-radius: 16px;
            padding: 8px 16px;
            border: 1px solid var(--border-color);
        }
        .qty-val {
            font-size: 18px;
            font-weight: 800;
            min-width: 24px;
            text-align: center;
            color: var(--text-main);
        }
        .qty-btn-custom {
            border: none;
            background: none;
            cursor: pointer;
            font-size: 18px;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            transition: all 0.2s;
        }
        .qty-btn-custom:hover {
            background: rgba(63,0,231,0.08);
        }
        .add-cart-btn-large {
            flex-grow: 1;
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 24px rgba(63,0,231,0.2);
            transition: all 0.3s ease;
        }
        .add-cart-btn-large:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(63,0,231,0.3);
        }
        .badge-stock {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            width: fit-content;
        }
        .badge-instock {
            background: rgba(52,199,89,0.1);
            color: var(--success-color);
        }
        .badge-outstock {
            background: rgba(255,59,48,0.1);
            color: var(--danger-color);
        }
        body.ltr .back-btn i {
            transform: rotate(180deg);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="mobile-navbar">
            <div class="logo-text" style="flex-direction:row; align-items:center; gap: 8px;">
                <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" width="30" height="30" style="flex-shrink:0;"><defs><radialGradient id="mpl-pillGrad" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#d5c0ff"/><stop offset="45%" stop-color="#8f7bff"/><stop offset="100%" stop-color="#6846f0"/></radialGradient><linearGradient id="mpl-pillShine" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="rgba(255,255,255,0.7)"/><stop offset="60%" stop-color="rgba(255,255,255,0)"/></linearGradient><linearGradient id="mpl-ringGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#a89cff"/><stop offset="50%" stop-color="#6d4bff"/><stop offset="100%" stop-color="#d4c2ff"/></linearGradient><filter id="mpl-glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g class="pill-group"><rect x="60" y="60" width="80" height="100" rx="40" ry="40" fill="url(#mpl-pillGrad)" filter="url(#mpl-glow)"/><rect x="60" y="60" width="80" height="100" rx="40" ry="40" fill="url(#mpl-pillShine)" opacity="0.7"/><rect x="91" y="78" width="18" height="44" rx="4" fill="white" opacity="0.95"/><rect x="78" y="91" width="44" height="18" rx="4" fill="white" opacity="0.95"/></g><g class="orbit-ring"><ellipse cx="100" cy="115" rx="60" ry="20" fill="none" stroke="url(#mpl-ringGrad)" stroke-width="7" stroke-dasharray="94 94" stroke-dashoffset="94" filter="url(#mpl-glow)"/></g><circle cx="158" cy="72" r="14" fill="#8f7bff"/><circle cx="153" cy="67" r="5" fill="rgba(255,255,255,0.55)"/></svg>
                <span class="logo-title" style="font-size:16px;">PharmaLink</span>
            </div>
            <button class="mobile-menu-btn"><i class="ph ph-list"></i></button>
        </div>
        
        <aside class="sidebar">
            <div class="logo-container">
                <div class="logo-icon">
                    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" width="44" height="44">
                        <defs>
                            <radialGradient id="spl-pillGrad" cx="35%" cy="30%" r="70%">
                                <stop offset="0%" stop-color="#d5c0ff"/>
                                <stop offset="45%" stop-color="#8f7bff"/>
                                <stop offset="100%" stop-color="#6846f0"/>
                            </radialGradient>
                            <linearGradient id="spl-pillShine" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" stop-color="rgba(255,255,255,0.7)"/>
                                <stop offset="60%" stop-color="rgba(255,255,255,0)"/>
                            </linearGradient>
                            <linearGradient id="spl-ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#a89cff"/>
                                <stop offset="50%" stop-color="#6d4bff"/>
                                <stop offset="100%" stop-color="#d4c2ff"/>
                            </linearGradient>
                            <radialGradient id="spl-sphereGrad" cx="35%" cy="30%" r="65%">
                                <stop offset="0%" stop-color="#f3e4ff"/>
                                <stop offset="50%" stop-color="#8f7bff"/>
                                <stop offset="100%" stop-color="#5e3cff"/>
                            </radialGradient>
                            <linearGradient id="spl-leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="rgba(171,146,255,0.34)"/>
                                <stop offset="100%" stop-color="rgba(111,85,255,0)"/>
                            </linearGradient>
                            <filter id="spl-glow">
                                <feGaussianBlur stdDeviation="3" result="blur"/>
                                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                            </filter>
                        </defs>
                        <g class="pill-group">
                            <rect x="60" y="60" width="80" height="100" rx="40" ry="40" fill="url(#spl-pillGrad)" filter="url(#spl-glow)"/>
                            <rect x="60" y="60" width="80" height="100" rx="40" ry="40" fill="url(#spl-pillShine)" opacity="0.7"/>
                            <path d="M60,110 Q55,80 80,65 Q65,90 70,110 Z" fill="url(#spl-leafGrad)" opacity="0.6"/>
                            <path d="M140,110 Q145,80 120,65 Q135,90 130,110 Z" fill="url(#spl-leafGrad)" opacity="0.4"/>
                            <line x1="60" y1="110" x2="140" y2="110" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
                            <rect x="91" y="78" width="18" height="44" rx="4" fill="white" opacity="0.95"/>
                            <rect x="78" y="91" width="44" height="18" rx="4" fill="white" opacity="0.95"/>
                        </g>
                        <g class="orbit-ring">
                            <ellipse cx="100" cy="115" rx="60" ry="20" fill="none" stroke="url(#spl-ringGrad)" stroke-width="7" stroke-dasharray="94 94" stroke-dashoffset="0" opacity="0.5"/>
                            <ellipse cx="100" cy="115" rx="60" ry="20" fill="none" stroke="url(#spl-ringGrad)" stroke-width="7" stroke-dasharray="94 94" stroke-dashoffset="94" filter="url(#spl-glow)"/>
                        </g>
                        <circle cx="158" cy="72" r="14" fill="url(#spl-sphereGrad)" filter="url(#spl-glow)"/>
                        <circle cx="153" cy="67" r="5" fill="rgba(255,255,255,0.55)"/>
                    </svg>
                </div>
                <div class="logo-text">
                    <span class="logo-title">PharmaLink</span>
                    <span class="logo-subtitle lang-text" data-ar="صيدلية رقمية" data-en="Digital Pharmacy">صيدلية رقمية</span>
                </div>
            </div>
            <nav class="nav-menu">
                <a href="index.html" class="nav-item">
                    <i class="ph ph-house"></i>
                    <span class="lang-text" data-ar="الرئيسية" data-en="Home">الرئيسية</span>
                </a>
                <a href="search.html" class="nav-item">
                    <i class="ph ph-magnifying-glass"></i>
                    <span class="lang-text" data-ar="بحث" data-en="Search">بحث</span>
                </a>
                <a href="cart.html" class="nav-item">
                    <i class="ph ph-shopping-cart"></i>
                    <span class="lang-text" data-ar="السلة" data-en="Cart">السلة</span>
                </a>
                <a href="Orders Tracking Page.html" class="nav-item">
                    <i class="ph ph-package"></i>
                    <span class="lang-text" data-ar="طلباتي" data-en="Orders">طلباتي</span>
                </a>
                <a href="notifications.html" class="nav-item">
                    <i class="ph ph-bell"></i>
                    <span class="lang-text" data-ar="الإشعارات" data-en="Notifications">الإشعارات</span>
                </a>
                <a href="Profile Page.html" class="nav-item">
                    <i class="ph ph-user"></i>
                    <span class="lang-text" data-ar="الملف الشخصي" data-en="Profile">الملف الشخصي</span>
                </a>
                <a href="#" class="nav-item logout-nav">
                    <i class="ph ph-sign-out"></i>
                    <span class="lang-text" data-ar="تسجيل خروج" data-en="Logout">تسجيل خروج</span>
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="search-bar-top" style="visibility: hidden;">
                    <i class="ph ph-magnifying-glass"></i>
                    <input type="text">
                </div>
                <div class="user-profile">
                    <button id="lang-toggle" style="background:var(--bg-color); border:1px solid var(--border-color); padding: 8px 12px; border-radius: 8px; cursor:pointer; font-weight:bold; font-family:inherit;">EN</button>
                </div>
            </header>

            <div class="page-header mb-4" style="display: flex; align-items: center; gap: 16px; margin-bottom: 30px;">
                <button class="back-btn" onclick="history.back()" style="background: var(--bg-card); border: 1px solid var(--border-color); width: 44px; height: 44px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-main); transition: all 0.2s;">
                    <i class="ph ph-arrow-right" style="font-size: 20px;"></i>
                </button>
                <h2 class="page-title lang-text" data-ar="تفاصيل الدواء" data-en="Medicine Details" style="margin: 0;">تفاصيل الدواء</h2>
            </div>

            <div class="details-container">
                <div class="details-grid">
                    <!-- Image pane -->
                    <div class="img-container" id="med-img-box">
                        <i class="ph ph-pill" style="font-size: 120px; color: #ccc;"></i>
                    </div>

                    <!-- Info Pane -->
                    <div class="info-pane">
                        <div style="display: flex; flex-direction: column; gap: 10px;">
                            <div id="stock-badge-box"></div>
                            <h1 class="med-title" id="med-title-text">-</h1>
                            <div class="med-pharmacy" id="med-pharmacy-box">
                                <i class="ph ph-storefront"></i>
                                <span id="med-pharmacy-name">-</span>
                            </div>
                        </div>

                        <div class="price-badge">
                            <span id="med-price-num">-</span>
                            <span class="lang-text" style="font-size: 16px; color: var(--text-muted);" data-ar="جنيه مصري" data-en="EGP">جنيه مصري</span>
                        </div>

                        <div class="meta-list">
                            <div class="meta-item">
                                <span class="meta-label lang-text" data-ar="المادة الفعالة" data-en="Active Ingredient">المادة الفعالة</span>
                                <span class="meta-val" id="med-active-ingredient">-</span>
                            </div>
                            <div class="meta-item">
                                <span class="meta-label lang-text" data-ar="الشركة المصنعة" data-en="Manufacturer">الشركة المصنعة</span>
                                <span class="meta-val" id="med-manufacturer">-</span>
                            </div>
                            <div class="meta-item">
                                <span class="meta-label lang-text" data-ar="الشكل الدوائي" data-en="Dosage Form">الشكل الدوائي</span>
                                <span class="meta-val" id="med-dosage-form">-</span>
                            </div>
                            <div class="meta-item">
                                <span class="meta-label lang-text" data-ar="الفئة العلاجية" data-en="Category">الفئة العلاجية</span>
                                <span class="meta-val" id="med-category">-</span>
                            </div>
                        </div>

                        <div style="display: flex; flex-direction: column; gap: 8px;">
                            <h3 class="lang-text" style="font-size: 16px; font-weight: 700;" data-ar="الوصف" data-en="Description">الوصف</h3>
                            <p class="desc-text" id="med-desc">-</p>
                        </div>

                        <!-- Actions -->
                        <div class="action-bar">
                            <div class="qty-selector">
                                <button class="qty-btn-custom" onclick="adjustDetailQty(-1)"><i class="ph ph-minus"></i></button>
                                <span class="qty-val" id="med-detail-qty">1</span>
                                <button class="qty-btn-custom" onclick="adjustDetailQty(1)"><i class="ph ph-plus"></i></button>
                            </div>

                            <button class="add-cart-btn-large" onclick="addCurrentToCart()">
                                <i class="ph ph-shopping-cart" style="font-size: 22px;"></i>
                                <span class="lang-text" data-ar="إضافة إلى السلة" data-en="Add to Cart">إضافة إلى السلة</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Script references -->
    <script src="assets/js/script.js"></script>
    <script>
        let currentDetailMedicine = null;
        let selectedQty = 1;

        document.addEventListener('DOMContentLoaded', async () => {
            // Read ID from URL query parameters
            const urlParams = new URLSearchParams(window.location.search);
            const medicineId = urlParams.get('id');

            if (!medicineId) {
                showToast(currentLang === 'ar' ? 'معرف الدواء غير صالح' : 'Invalid medicine ID', 'error');
                return;
            }

            try {
                // Fetch medicine details from API
                const response = await fetch(`${API_BASE_URL}/medicines/${medicineId}`);
                if (!response.ok) throw new Error('Medicine details fetch failed');

                const med = await response.json();
                currentDetailMedicine = med;

                // Render Details
                document.getElementById('med-title-text').textContent = med.name;
                document.getElementById('med-price-num').textContent = med.price;
                document.getElementById('med-active-ingredient').textContent = med.activeIngredient || (currentLang === 'ar' ? 'غير متوفر' : 'N/A');
                document.getElementById('med-manufacturer').textContent = med.manufacturer || (currentLang === 'ar' ? 'غير متوفر' : 'N/A');
                document.getElementById('med-dosage-form').textContent = med.dosageForm || (currentLang === 'ar' ? 'غير متوفر' : 'N/A');
                document.getElementById('med-category').textContent = med.therapeuticCategory || (currentLang === 'ar' ? 'غير متوفر' : 'N/A');
                document.getElementById('med-desc').textContent = med.description || (currentLang === 'ar' ? 'لا يوجد وصف متاح لهذا الدواء.' : 'No description available for this medicine.');

                // Pharmacy
                const phName = med.pharmacy && med.pharmacy.name ? med.pharmacy.name : (currentLang === 'ar' ? 'صيدلية عامة' : 'General Pharmacy');
                document.getElementById('med-pharmacy-name').textContent = phName;

                // Stock Badge
                const badgeBox = document.getElementById('stock-badge-box');
                if (med.stock > 0) {
                    badgeBox.innerHTML = `<span class="badge-stock badge-instock lang-text" data-ar="متوفر في المخزن" data-en="In Stock">${currentLang === 'ar' ? 'متوفر في المخزن' : 'In Stock'}</span>`;
                } else {
                    badgeBox.innerHTML = `<span class="badge-stock badge-outstock lang-text" data-ar="غير متوفر" data-en="Out of Stock">${currentLang === 'ar' ? 'غير متوفر' : 'Out of Stock'}</span>`;
                    document.querySelector('.add-cart-btn-large').disabled = true;
                    document.querySelector('.add-cart-btn-large').style.opacity = '0.5';
                }

                // Image
                const imgBox = document.getElementById('med-img-box');
                if (med.images && med.images.length > 0) {
                    imgBox.innerHTML = `<img src="${med.images[0]}" alt="${med.name}" class="detail-img">`;
                } else {
                    imgBox.innerHTML = `<i class="ph ph-pill" style="font-size: 120px; color: #ccc;"></i>`;
                }

                // Refresh language terms
                applyLanguage(currentLang);

            } catch (error) {
                console.error(error);
                showToast(currentLang === 'ar' ? 'فشل تحميل تفاصيل الدواء' : 'Failed to load medicine details', 'error');
            }
        });

        function adjustDetailQty(val) {
            selectedQty += val;
            if (selectedQty < 1) selectedQty = 1;
            
            // Check stock limit
            if (currentDetailMedicine && selectedQty > currentDetailMedicine.stock) {
                selectedQty = currentDetailMedicine.stock;
                showToast(currentLang === 'ar' ? `الحد الأقصى للكمية المتاحة هو ${currentDetailMedicine.stock}` : `Maximum available stock is ${currentDetailMedicine.stock}`, 'warning');
            }

            document.getElementById('med-detail-qty').textContent = selectedQty;
        }

        function addCurrentToCart() {
            if (!currentDetailMedicine) return;

            let cart = JSON.parse(localStorage.getItem('patientCart')) || [];
            const existingItem = cart.find(item => item.id === currentDetailMedicine._id);
            const pharmacyId = currentDetailMedicine.pharmacy && currentDetailMedicine.pharmacy._id ? currentDetailMedicine.pharmacy._id : '';

            if (existingItem) {
                existingItem.qty += selectedQty;
            } else {
                cart.push({
                    id: currentDetailMedicine._id,
                    name: currentDetailMedicine.name,
                    price: currentDetailMedicine.price,
                    image: (currentDetailMedicine.images && currentDetailMedicine.images.length > 0) ? currentDetailMedicine.images[0] : '',
                    qty: selectedQty,
                    pharmacyId: pharmacyId
                });
            }

            localStorage.setItem('patientCart', JSON.stringify(cart));
            showToast(currentLang === 'ar' ? 'تمت إضافة الكمية المحددة للسلة' : 'Selected quantity added to cart');
        }
    </script>
</body>
</html>
