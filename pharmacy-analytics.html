        <main class="main-content">
            <header class="topbar">

                <div class="date-filter">

                <div class="widget-card">

            <div class="widget-card mt-4">

                    <button class="btn-outline-custom lang-text" data-ar="تصدير (PDF)" data-en="Export (PDF)" style="padding: 6px 12px; font-size:13px;"><i class="ph ph-download-simple"></i> تصدير (PDF)</button>

                            <tr>
                                <th class="lang-text" data-ar="التاريخ" data-en="Date">التاريخ</th>
                                <th class="lang-text" data-ar="عدد الطلبات" data-en="Orders Count">عدد الطلبات</th>
                                <th class="lang-text" data-ar="إجمالي المبيعات" data-en="Total Sales">إجمالي المبيعات</th>
                                <th class="lang-text" data-ar="متوسط قيمة الطلب" data-en="Average Order Value">متوسط قيمة الطلب</th>
                            </tr>
                        </thead>
                        <tbody id="reports-tbody">

    <script src="assets/js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('userToken');
            if (!token) return window.location.href = 'auth.html';

            const parseJwt = (token) => {
                try { return JSON.parse(atob(token.split('.')[1])); } catch (e) { return null; }
            };
            const decoded = parseJwt(token);
            const pharmacyId = decoded ? decoded.id : null;
            if (!pharmacyId) return;

            let salesChartInst = null;
            let productsChartInst = null;

            try {
                const res = await fetch(`http://localhost:3000/api/orders/pharmacy/${pharmacyId}`);
                if (res.ok) {
                    const orders = await res.json();
                    
                    // Simple logic to group by date
                    const dailyData = {};
                    const productCount = {};
                    
                    orders.forEach(order => {
                        const d = new Date(order.createdAt).toLocaleDateString('ar-EG');
                        if(!dailyData[d]) dailyData[d] = { count: 0, total: 0 };
                        dailyData[d].count += 1;
                        dailyData[d].total += order.totalPrice;

                        order.items.forEach(item => {
                            const name = item.medicine ? item.medicine.name : 'Unknown';
                            if(!productCount[name]) productCount[name] = 0;
                            productCount[name] += item.quantity;
                        });
                    });

                    // Render Table
                    const tbody = document.getElementById('reports-tbody');
                    tbody.innerHTML = '';
                    const dates = Object.keys(dailyData).sort((a,b) => new Date(b) - new Date(a));
                    if(dates.length === 0) {
                        const noReportsMsg = currentLang === 'ar' ? 'لا توجد تقارير حالياً' : 'No reports currently available';
                        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;" class="lang-text" data-ar="لا توجد تقارير حالياً" data-en="No reports currently available">${noReportsMsg}</td></tr>`;
                    } else {
                        dates.slice(0,10).forEach(date => {
                            const data = dailyData[date];
                            const avg = (data.total / data.count).toFixed(2);
                            const sym = currentLang === 'ar' ? 'جنيه' : 'EGP';
                            tbody.innerHTML += `
                                <tr>
                                    <td>${date}</td>
                                    <td>${data.count}</td>
                                    <td>${data.total} <span class="currency-symbol lang-text" data-ar="جنيه" data-en="EGP">${sym}</span></td>
                                    <td>${avg} <span class="currency-symbol lang-text" data-ar="جنيه" data-en="EGP">${sym}</span></td>
                                </tr>
                            `;
                        });
                    }

                    // Render Sales Chart
                    const chartDates = dates.slice(0, 7).reverse();
                    const chartTotals = chartDates.map(d => dailyData[d].total);
                    
                    const ctxSales = document.getElementById('salesChart');
                    if(ctxSales) {
                        salesChartInst = new Chart(ctxSales, {
                            type: 'line',
                            data: {
                                labels: chartDates.length ? chartDates : [(currentLang === 'ar' ? 'لا بيانات' : 'No Data')],
                                datasets: [{
                                    label: (currentLang === 'ar' ? 'المبيعات' : 'Sales'),
                                    data: chartTotals.length ? chartTotals : [0],
                                    borderColor: '#3f00e7',
                                    backgroundColor: 'rgba(63, 0, 231, 0.1)',
                                    fill: true,
                                    tension: 0.4
                                }]
                            },
                            options: { responsive: true }
                        });
                    }

                    // Render Products Chart
                    const sortedProducts = Object.entries(productCount).sort((a,b) => b[1] - a[1]).slice(0,4);
                    const pLabels = sortedProducts.map(p => p[0]);
                    const pData = sortedProducts.map(p => p[1]);

                    const ctxProducts = document.getElementById('topProductsChart');
                    if(ctxProducts && pLabels.length > 0) {
                        productsChartInst = new Chart(ctxProducts, {
                            type: 'doughnut',
                            data: {
                                labels: pLabels,
                                datasets: [{
                                    data: pData,
                                    backgroundColor: ['#3f00e7', '#00b4d8', '#34c759', '#ffcc00']
                                }]
                            },
                            options: { responsive: true, cutout: '70%' }
                        });
                    }
                }
            } catch (error) {
                console.error('Error fetching analytics:', error);
            }
        });
    </script>
