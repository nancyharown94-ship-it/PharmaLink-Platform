        <main class="main-content">
            <header class="topbar">
                <div class="search-bar-top">

            <div class="page-header flex-between mb-4">

                <div class="search-bar-top" style="width:250px;">
                    <i class="ph ph-magnifying-glass"></i>
                    <input type="text" id="order-search-input" class="lang-text" data-ar="بحث برقم الطلب..." data-en="Search order..." placeholder="بحث برقم الطلب...">
                </div>
            </div>

            <div class="orders-tabs mb-4">
                <button class="tab-btn active lang-text" data-status="all" data-ar="الكل" data-en="All">الكل</button>
                <button class="tab-btn lang-text" data-status="pending" data-ar="قيد الانتظار" data-en="Pending">قيد الانتظار</button>
                <button class="tab-btn lang-text" data-status="preparing" data-ar="جاري التجهيز" data-en="Processing">جاري التجهيز</button>
                <button class="tab-btn lang-text" data-status="out_for_delivery" data-ar="خارج للتوصيل" data-en="Out for Delivery">خارج للتوصيل</button>
                <button class="tab-btn lang-text" data-status="delivered" data-ar="مكتمل" data-en="Completed">مكتمل</button>
            </div>

            <div class="widget-card">
                <div class="table-responsive">
                    <table class="custom-table">
                        <thead>
                            <tr>
                                <th class="lang-text" data-ar="رقم الطلب" data-en="Order ID">رقم الطلب</th>
                                <th class="lang-text" data-ar="العميل" data-en="Customer">العميل</th>
                                <th class="lang-text" data-ar="التاريخ" data-en="Date">التاريخ</th>
                                <th class="lang-text" data-ar="المنتجات" data-en="Items">المنتجات</th>
                                <th class="lang-text" data-ar="الإجمالي" data-en="Total">الإجمالي</th>
                                <th class="lang-text" data-ar="الحالة" data-en="Status">الحالة</th>
                                <th class="lang-text" data-ar="الإجراءات" data-en="Actions">الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="orders-tbody">
                            <tr>

    <script src="assets/js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('userToken');
            if (!token) return window.location.href = 'auth.html';

            const parseJwt = (token) => {
                try { return JSON.parse(atob(token.split('.')[1])); } catch (e) { return null; }
            };
            const decoded = parseJwt(token);
            const pharmacyId = decoded ? decoded.id : null;
            if (!pharmacyId) return;

            let allOrders = [];
            let activeFilter = 'all';
            let searchQuery = '';

            const fetchOrders = async () => {
                try {
                    const res = await fetch(`http://localhost:3000/api/orders/pharmacy/${pharmacyId}`);
                    if (res.ok) {
                        allOrders = await res.json();
                        filterAndRenderOrders();
                    }
                } catch (error) {
                    console.error('Error fetching orders:', error);
                }
            };

            const filterAndRenderOrders = () => {
                let filtered = allOrders;
                if (activeFilter !== 'all') {
                    filtered = allOrders.filter(order => order.status === activeFilter);
                }
                if (searchQuery.trim() !== '') {
                    const q = searchQuery.trim().toLowerCase();
                    filtered = filtered.filter(order => {
                        const orderId = order._id ? order._id.toLowerCase() : '';
                        const shortId = orderId.slice(-6);
                        const customerName = order.user && order.user.name ? order.user.name.toLowerCase() : '';
                        return orderId.includes(q) || shortId.includes(q) || customerName.includes(q);
                    });
                }
                renderOrders(filtered);
            };

            const renderOrders = (orders) => {
                const tbody = document.getElementById('orders-tbody');
                tbody.innerHTML = '';
                if (orders.length === 0) {
                    const emptyAr = 'لا توجد طلبات في هذا القسم';
                    const emptyEn = 'No orders in this category';
                    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;" class="lang-text" data-ar="${emptyAr}" data-en="${emptyEn}">${currentLang === 'ar' ? emptyAr : emptyEn}</td></tr>`;
                    return;
                }
                orders.forEach(order => {
                    const tr = document.createElement('tr');
                    const customerName = order.user ? order.user.name : (currentLang === 'ar' ? 'غير معروف' : 'Unknown');
                    const date = new Date(order.createdAt).toLocaleDateString(currentLang === 'ar' ? 'ar-EG' : 'en-US');
                    const itemsCount = order.items ? order.items.length : 0;
                    
                    let statusClass = 'status-pending';
                    let statusTextAr = 'قيد الانتظار';
                    let statusTextEn = 'Pending';
                    
                    let actions = '';
                    if (order.status === 'pending') {
                        statusTextAr = 'طلب جديد';
                        statusTextEn = 'New Order';
                        actions = `
                            <button class="btn-action btn-accept" onclick="updateStatus('${order._id}', 'preparing')" title="Accept" style="background:var(--success-color); color:white;"><i class="ph ph-check"></i></button>
                            <button class="btn-action btn-reject" onclick="updateStatus('${order._id}', 'cancelled')" title="Reject" style="background:var(--danger-color); color:white;"><i class="ph ph-x"></i></button>
                        `;
                    } else if (order.status === 'preparing') {
                        statusClass = 'status-processing';
                        statusTextAr = 'جاري التجهيز';
                        statusTextEn = 'Preparing';
                        actions = `<button class="btn-action btn-ready lang-text" data-ar="خرج من الصيدلية" data-en="Out for Delivery" onclick="updateStatus('${order._id}', 'out_for_delivery')" style="width:auto; padding:6px 12px; background:var(--primary-gradient); color:white; border:none; border-radius:8px; font-family:inherit; font-weight:bold; cursor:pointer;">${currentLang === 'ar' ? 'خرج من الصيدلية' : 'Out for Delivery'}</button>`;
                    } else if (order.status === 'out_for_delivery') {
                        statusClass = 'status-processing';
                        statusTextAr = 'خارج للتوصيل';
                        statusTextEn = 'Out for Delivery';
                        actions = `<span class="lang-text" data-ar="بانتظار العميل" data-en="Awaiting Customer" style="font-size:13px; color:var(--text-muted); font-weight:bold;">${currentLang === 'ar' ? 'بانتظار العميل' : 'Awaiting Customer'}</span>`;
                    } else if (order.status === 'delivered') {
                        statusClass = 'status-completed';
                        statusTextAr = 'تم الاستلام';
                        statusTextEn = 'Delivered';
                        actions = `<span class="lang-text" data-ar="مكتمل" data-en="Completed" style="color:var(--success-color); font-weight:bold; display:flex; align-items:center; gap:4px; font-size:14px;"><i class="ph ph-check-circle" style="font-size:18px;"></i> ${currentLang === 'ar' ? 'مكتمل' : 'Completed'}</span>`;
                    } else {
                        statusClass = 'status-cancelled';
                        statusTextAr = 'ملغي';
                        statusTextEn = 'Cancelled';
                        actions = `<span style="color:var(--text-muted);">-</span>`;
                    }
                    
                    const statusText = currentLang === 'ar' ? statusTextAr : statusTextEn;
                    const itemsText = currentLang === 'ar' ? 'منتجات' : 'items';
                    const sym = currentLang === 'ar' ? 'جنيه' : 'EGP';

                    tr.innerHTML = `
                        <td>#${order._id.substring(order._id.length - 6).toUpperCase()}</td>
                        <td class="lang-text" data-ar="${order.user ? order.user.name : 'غير معروف'}" data-en="${order.user ? order.user.name : 'Unknown'}">${customerName}</td>
                        <td>${date}</td>
                        <td>${itemsCount} <span class="lang-text" data-ar="منتجات" data-en="items">${itemsText}</span></td>
                        <td>${order.totalPrice} <span class="currency-symbol lang-text" data-ar="جنيه" data-en="EGP">${sym}</span></td>
                        <td><span class="status-badge ${statusClass} lang-text" data-ar="${statusTextAr}" data-en="${statusTextEn}">${statusText}</span></td>
                        <td>
                            <div class="action-buttons">
                                ${actions}
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            };

            // Register tab triggers
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    activeFilter = tab.getAttribute('data-status');
                    filterAndRenderOrders();
                });
            });

            // Register search input triggers
            const orderSearchInput = document.getElementById('order-search-input');
            const topbarSearchInput = document.getElementById('topbar-search-input');
            
            const handleSearch = (e) => {
                searchQuery = e.target.value;
                // Sync both inputs if needed
                if (orderSearchInput && e.target === topbarSearchInput) orderSearchInput.value = searchQuery;
                if (topbarSearchInput && e.target === orderSearchInput) topbarSearchInput.value = searchQuery;
                filterAndRenderOrders();
            };

            if (orderSearchInput) orderSearchInput.addEventListener('input', handleSearch);
            if (topbarSearchInput) topbarSearchInput.addEventListener('input', handleSearch);

            window.updateStatus = async (orderId, status) => {
                try {
                    const res = await fetch(`http://localhost:3000/api/orders/${orderId}/status`, {
                        method: 'PATCH',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ status })
                    });
                    if (res.ok) {
                        showToast(currentLang === 'ar' ? 'تم تحديث حالة الطلب بنجاح' : 'Order status updated successfully');
                        fetchOrders();
                    } else {
                        showToast(currentLang === 'ar' ? 'فشل تحديث حالة الطلب' : 'Failed to update order status', 'error');
                    }
                } catch (error) {
                    console.error('Error updating status:', error);
                    showToast(currentLang === 'ar' ? 'خطأ في الاتصال بالسيرفر' : 'Server connection error', 'error');
                }
            };

            fetchOrders();
        });
    </script>
