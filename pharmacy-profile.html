        <main class="main-content">
            <header class="topbar">
                <div class="search-bar-top">
                    <i class="ph ph-magnifying-glass"></i>
                    <input type="text" class="lang-text" data-ar="ابحث..." data-en="Search..." placeholder="ابحث...">
                </div>
                <div class="user-profile">
                    <button id="lang-toggle" style="background:var(--bg-color); border:1px solid var(--border-color); padding: 8px 12px; border-radius: 8px; cursor:pointer; font-weight:bold; font-family:inherit;">EN</button>
                </div>
            </header>

            <div class="page-header mb-4">
                <h2 class="page-title lang-text" data-ar="ملف الصيدلية" data-en="Pharmacy Profile" style="margin: 0;">ملف الصيدلية</h2>
            </div>

            <div class="widget-card">
                <div class="profile-tabs">
                    <div class="tab active lang-text" data-ar="بيانات الصيدلية" data-en="Pharmacy Data" data-target="details">بيانات الصيدلية</div>
                    <div class="tab lang-text" data-ar="أوقات العمل" data-en="Working Hours" data-target="working-hours">أوقات العمل</div>
                </div>

                <div class="tab-content active" id="details">
                    <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 30px;">
                        <div style="width: 80px; height: 80px; background: var(--bg-color); border-radius: 12px; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 2px solid var(--primary-color);">
                            <img id="profile-avatar" src="assets/images/pharmacy_logo.png" style="width:100%; height:100%; object-fit:cover;" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2966/2966327.png'">
                        </div>
                        <button id="change-photo-btn" class="btn-outline-custom lang-text" data-ar="تغيير الشعار" data-en="Change Logo" style="padding: 8px 16px; font-size: 14px;">تغيير الشعار</button>

                    </div>

                    <div class="medicine-form">
                        <div class="form-grid-2">
                            <div class="form-group">
                                <label class="lang-text" data-ar="اسم الصيدلية" data-en="Pharmacy Name">اسم الصيدلية</label>
                                <input type="text" id="profile-name" class="form-control lang-text" data-ar="صيدلية النهدي" data-en="Nahdi Pharmacy" placeholder="صيدلية النهدي" value="">
                            </div>
                            <div class="form-group">
                                <label class="lang-text" data-ar="رقم الرخصة" data-en="License Number">رقم الرخصة</label>
                                <input type="text" id="profile-license" class="form-control" value="" style="direction: ltr; text-align: right;">
                            </div>
                            <div class="form-group">
                                <label class="lang-text" data-ar="رقم التواصل" data-en="Contact Number">رقم التواصل</label>
                                <input type="text" id="profile-phone" class="form-control" value="" style="direction: ltr; text-align: right;">
                            </div>
                            <div class="form-group">
                                <label class="lang-text" data-ar="البريد الإلكتروني" data-en="Email Address">البريد الإلكتروني</label>

                            </div>

                                <label class="lang-text" data-ar="عنوان الصيدلية" data-en="Pharmacy Address">عنوان الصيدلية</label>

                            </div>
                        </div>
                        <div style="margin-top: 24px;">
                            <button id="save-details-btn" class="btn-primary-custom lang-text" data-ar="حفظ التغييرات" data-en="Save Changes">حفظ التغييرات</button>
                        </div>

                        <div class="form-grid-2">
                            <div class="form-group">
                                <label class="lang-text" data-ar="من الساعة" data-en="From Time">من الساعة</label>
                                <input type="time" id="profile-time-from" class="form-control" value="09:00">
                            </div>
                            <div class="form-group">
                                <label class="lang-text" data-ar="إلى الساعة" data-en="To Time">إلى الساعة</label>

                            </div>

                                    <option value="مفتوحة الآن" class="lang-text" data-ar="مفتوحة الآن" data-en="Open Now">مفتوحة الآن</option>
                                    <option value="مغلقة" class="lang-text" data-ar="مغلقة" data-en="Closed">مغلقة</option>
                                    <option value="تعمل 24 ساعة" class="lang-text" data-ar="تعمل 24 ساعة" data-en="24/7 Open">تعمل 24 ساعة</option>
                                </select>

                        </div>
                    </div>
                </div>

    <script src="assets/js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('userToken');
            if (!token) return window.location.href = 'auth.html';

            const tabs = document.querySelectorAll('.tab');
            const contents = document.querySelectorAll('.tab-content');
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    contents.forEach(c => c.classList.remove('active'));
                    tab.classList.add('active');
                    document.getElementById(tab.dataset.target).classList.add('active');
                });
            });

            let currentPhotoBase64 = null;

            // Fetch profile
            try {
                const res = await fetch('http://localhost:3000/api/users/profile', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('profile-name').value = data.name || '';
                    document.getElementById('profile-email').value = data.email || '';
                    document.getElementById('profile-phone').value = data.phone || '';
                    document.getElementById('profile-address').value = data.address || '';
                    
                    if (data.profilePhoto) {
                        currentPhotoBase64 = data.profilePhoto;
                        document.getElementById('profile-avatar').src = data.profilePhoto;
                    }
                    
                    // Fields that might need additional get request if not returned in getUserProfile
                    if(data.licenseNumber) document.getElementById('profile-license').value = data.licenseNumber;
                    if(data.workingHours) {
                        if(data.workingHours.from) document.getElementById('profile-time-from').value = data.workingHours.from;
                        if(data.workingHours.to) document.getElementById('profile-time-to').value = data.workingHours.to;
                    }
                    if(data.pharmacyStatus) document.getElementById('profile-status').value = data.pharmacyStatus;
                }
            } catch(e) {
                console.error(e);
            }

            const updateProfile = async (updates) => {
                try {
                    const res = await fetch('http://localhost:3000/api/users/profile', {
                        method: 'PUT',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify(updates)
                    });
                    if (res.ok) {
                        const isAr = localStorage.getItem('currentLang') === 'ar' || document.documentElement.lang === 'ar';
                        showToast(isAr ? 'تم الحفظ بنجاح 🎉' : 'Saved successfully 🎉');
                    } else {
                        const isAr = localStorage.getItem('currentLang') === 'ar' || document.documentElement.lang === 'ar';
                        showToast(isAr ? 'حدث خطأ أثناء الحفظ' : 'Error saving profile', 'error');
                    }
                } catch(e) {
                    console.error(e);
                    const isAr = localStorage.getItem('currentLang') === 'ar' || document.documentElement.lang === 'ar';
                    showToast(isAr ? 'فشل الاتصال بالسيرفر' : 'Server connection error', 'error');
                }
            };

            document.getElementById('save-details-btn').addEventListener('click', () => {
                updateProfile({
                    name: document.getElementById('profile-name').value,
                    email: document.getElementById('profile-email').value,
                    phone: document.getElementById('profile-phone').value,
                    address: document.getElementById('profile-address').value,
                    licenseNumber: document.getElementById('profile-license').value,
                    profilePhoto: currentPhotoBase64
                });
            });

            // Photo upload logic
            const changePhotoBtn = document.getElementById('change-photo-btn');
            const photoInput = document.getElementById('profile-photo-input');
            const avatarImg = document.getElementById('profile-avatar');

            if (changePhotoBtn && photoInput) {
                changePhotoBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    photoInput.click();
                });

                photoInput.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            currentPhotoBase64 = event.target.result;
                            avatarImg.src = currentPhotoBase64;
                            const isAr = localStorage.getItem('currentLang') === 'ar' || document.documentElement.lang === 'ar';
                            showToast(isAr ? 'تم تغيير الشعار! اضغط حفظ التغييرات.' : 'Logo changed! Click Save Changes.', 'success');
                        };
                        reader.readAsDataURL(file);
                    }
                });
            }

            document.getElementById('save-hours-btn').addEventListener('click', () => {
                updateProfile({
                    workingHours: {
                        from: document.getElementById('profile-time-from').value,
                        to: document.getElementById('profile-time-to').value
                    },
                    pharmacyStatus: document.getElementById('profile-status').value
                });
            });
        });
    </script>
